overwrite: true
schema: ../sdk/src/schema.graphql
documents: ../sdk/src/_generated_documents.graphql
hooks:
  afterOneFileWrite:
    - prettier --write
generates:
  src/commands/_generated_commands.ts:
    plugins:
      - "@linear/codegen-cli"

config:
  overrides:
    agentActivities: "agent-activity:list"
    agentActivity: "agent-activity:view"
    agentSession: "agent-session:view"
    agentSessions: "agent-session:list"
    comment: "comment:view"
    comments: "comment:list"
    cycle: "cycle:view"
    cycles: "cycle:list"
    document: "document:view"
    documents: "document:list"
    initiative: "initiative:view"
    initiatives: "initiative:list"
    initiativeUpdate: "initiative-update:view"
    initiativeUpdates: "initiative-update:list"
    issue: "issue:view"
    issues: "issue:list"
    project_projectMilestones: "project:milestones"
    project_projectUpdates: "project:updates"
    project: "project:view"
    projects: "project:list"
    projectStatus: "project-status:view"
    projectStatuses: "project-status:list"
    projectUpdate: "project-update:view"
    projectUpdates: "project-update:list"
    roadmap: "roadmap:view"
    roadmaps: "roadmap:list"
    team: "team:view"
    teams: "team:list"
    user: "user:view"
    users: "user:list"

  ignoreOperations:
    - administrableTeams
    - attachments
    - attachmentsForURL
    - auditEntries
    - auditEntryTypes
    - authenticationSessions
    - availableUsers
    - comment_botActor
    - customerNeeds
    - customers
    - customerStatus
    - customerStatuses
    - customerTier
    - customerTiers
    - customViewHasSubscribers
    - customViews
    - documentContentHistory
    - emoji
    - emojis
    - entityExternalLink
    - externalUser
    - externalUsers
    - favorites
    - initiativeRelation
    - initiativeRelations
    - initiativeToProject
    - initiativeToProjects
    - integrationHasScopes
    - integrations
    - integrationsSettings
    - integrationTemplate
    - integrationTemplates
    - issueFigmaFileKeySearch
    - issueFilterSuggestion
    - issueImportCheckCSV
    - issueImportCheckSync
    - issueImportJqlCheck
    - issueLabel
    - issueLabel_children
    - issueLabel_issues
    - issueLabels
    - issuePriorityValues
    - issueRelation
    - issueRelations
    - issueSearch
    - issueTitleSuggestionFromCustomerRequest
    - notification
    - notifications
    - notificationSubscription
    - notificationSubscriptions
    - organizationExists
    - organizationInvite
    - organizationInvites
    - project_inverseRelations
    - projectFilterSuggestion
    - projectMilestones
    - projectRelation
    - projectRelations
    - pushSubscriptionTest
    - rateLimitStatus
    - roadmapToProject
    - roadmapToProjects
    - semanticSearch
    - ssoUrlFromEmail
    - team_webhooks
    - teamMembership
    - teamMemberships
    - template
    - templates
    - templatesForIntegration
    - timeSchedule
    - timeSchedules
    - triageResponsibilities
    - triageResponsibility
    - triageResponsibility_manualSelection
    - verifyGitHubEnterpriseServerInstallation
    - webhook
